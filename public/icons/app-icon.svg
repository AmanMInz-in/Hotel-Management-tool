<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B20"/>
      <stop offset="100%" stop-color="#0F1115"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#262A33" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Radial Glow Behind Emblem -->
  <circle cx="256" cy="230" r="160" fill="url(#glowGrad)"/>

  <!-- Icon Emblem: Elegant Cloche / Plate / Star -->
  <g filter="url(#subtleShadow)" transform="translate(0, -10)">
    <!-- Cloche Handle / Knob -->
    <ellipse cx="256" cy="132" rx="16" ry="12" fill="url(#goldGrad)"/>
    <rect x="251" y="140" width="10" height="18" rx="4" fill="url(#goldGrad)"/>

    <!-- Cloche Dome -->
    <path d="M 140 260 C 140 160, 372 160, 372 260 Z" fill="url(#goldGrad)"/>
    <!-- Dome highlight -->
    <path d="M 160 250 C 170 180, 260 170, 300 185 C 250 175, 175 200, 160 250 Z" fill="#FFFFFF" opacity="0.35"/>

    <!-- Cloche Base Rim -->
    <rect x="124" y="260" width="264" height="14" rx="7" fill="#FCD34D"/>

    <!-- Serving Platter -->
    <path d="M 104 282 C 104 282, 130 306, 256 306 C 382 306, 408 282, 408 282 L 416 288 C 416 298, 380 320, 256 320 C 132 320, 96 298, 96 288 Z" fill="url(#goldGrad)"/>
    
    <!-- Steam Swirls -->
    <path d="M 210 115 C 205 95, 220 85, 215 70" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M 256 105 C 252 88, 264 78, 260 62" stroke="#FCD34D" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 302 115 C 297 95, 312 85, 307 70" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75"/>
  </g>

  <!-- Typography Pill: GRAND BISTRO -->
  <g transform="translate(256, 372)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#181B20" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#F8FAFC" letter-spacing="3.5">
      GRAND BISTRO
    </text>
  </g>

  <!-- Subtitle: POS TERMINAL -->
  <text x="256" y="432" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#F59E0B" letter-spacing="4">
    POS TERMINAL
  </text>
</svg>
