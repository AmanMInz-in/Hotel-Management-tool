<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>The Grand Bistro POS</title>
  <link rel="icon" type="image/png" href="/icons/icon-192x192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0F1115;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }
    .card {
      background: #181B20;
      border: 1px solid #262A33;
      border-radius: 24px;
      padding: 28px 24px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .logo-ring {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: #0F1115;
      border: 2px solid #F59E0B;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.25);
    }
    .logo-ring img {
      width: 64px;
      height: 64px;
      border-radius: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #F8FAFC;
      margin-bottom: 6px;
    }
    p {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .input-group {
      width: 100%;
      text-align: left;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748B;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      height: 48px;
      background: #0F1115;
      border: 1px solid #262A33;
      border-radius: 12px;
      color: #F8FAFC;
      font-size: 14px;
      padding: 0 14px;
      outline: none;
      font-family: monospace;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #F59E0B;
    }
    button {
      width: 100%;
      min-height: 52px;
      background: #F59E0B;
      color: #0F1115;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
      transition: transform 0.1s, background-color 0.2s;
    }
    button:active {
      transform: scale(0.98);
      background-color: #D97706;
    }
    .status-msg {
      font-size: 12px;
      color: #F59E0B;
      margin-top: 14px;
      min-height: 18px;
    }
    .reset-btn {
      background: none;
      border: none;
      color: #64748B;
      font-size: 11px;
      margin-top: 16px;
      cursor: pointer;
      box-shadow: none;
      font-weight: 600;
      min-height: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-ring">
      <img src="/icons/icon-192x192.png" alt="Grand Bistro">
    </div>
    <h1>The Grand Bistro</h1>
    <p>Handheld POS & Kitchen Terminal</p>

    <div class="input-group">
      <label for="serverUrl">POS Server URL</label>
      <input type="text" id="serverUrl" placeholder="http://192.168.1.100:3000" spellcheck="false" autocomplete="off">
    </div>

    <button id="connectBtn" onclick="connectToServer()">Connect to POS Terminal</button>
    <div id="statusMsg" class="status-msg"></div>
    <button class="reset-btn" onclick="clearSavedServer()">Clear Saved Server</button>
  </div>

  <script>
    const savedServer = localStorage.getItem("pos_server_url");
    const serverInput = document.getElementById("serverUrl");
    const statusMsg = document.getElementById("statusMsg");

    if (savedServer) {
      serverInput.value = savedServer;
      statusMsg.textContent = "Connecting to POS Terminal...";
      setTimeout(() => {
        redirectToLogin(savedServer);
      }, 600);
    } else {
      // Default to origin or localhost
      serverInput.value = window.location.origin.includes("http") && !window.location.origin.includes("localhost") 
        ? window.location.origin 
        : "http://10.0.2.2:3000";
    }

    function connectToServer() {
      let url = serverInput.value.trim();
      if (!url) {
        statusMsg.textContent = "Please enter a valid server URL";
        return;
      }
      if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = "http://" + url;
      }
      url = url.replace(/\/+$/, "");
      localStorage.setItem("pos_server_url", url);
      statusMsg.textContent = "Redirecting to Login...";
      redirectToLogin(url);
    }

    function redirectToLogin(baseUrl) {
      const target = baseUrl + "/login";
      window.location.replace(target);
    }

    function clearSavedServer() {
      localStorage.removeItem("pos_server_url");
      serverInput.value = "http://10.0.2.2:3000";
      statusMsg.textContent = "Server configuration reset.";
    }
  </script>
</body>
</html>
